name: Actualisation quotidienne Veille IA
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-veille-ia
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collecter les nouveautés officielles
        run: node scripts/update-news.mjs
      - name: Publier uniquement si nécessaire
        run: |
          git config user.name "veille-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: actualisation quotidienne des nouveautés IA"
            git push
          fi
