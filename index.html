async function enablePush(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Notifications indisponibles');if(/iPhone|iPad/.test(navigator.userAgent)&&!navigator.standalone&&!matchMedia('(display-mode: standalone)').matches)throw Error('Ouvre l’application depuis son icône iPhone');if(await Notification.requestPermission()!=='granted')throw Error('Autorisation refusée');const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const key=PUSH_KEY.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(key+'='.repeat((4-key.length%4)%4));sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(bin,c=>c.charCodeAt(0))})}const d=pushDevice();await pushReq('/register',{deviceId:d.id,secret:d.secret,subscription:sub.toJSON()});localStorage.setItem('veille-push-active','1');await syncPush()}

 popup(`Connecter ${esc(item.title)}`,`<p>Les plugins ChatGPT doivent être autorisés <strong>dans ChatGPT</strong>. Une application tierce ne peut pas les installer silencieusement.</p><p>Ouvre ChatGPT → Paramètres → Plugins, puis recherche <strong>${esc(item.title)}</strong>. Autorise uniquement les accès que tu acceptes.</p>`,`<button class="action-btn" data-action="open-chatgpt">Ouvrir ChatGPT</button><button class="action-btn secondary" data-action="toggle-installed" data-id="${esc(item.id)}">${installed(item)?'Marquer non installé':'Marquer installé'}</button>`);return;
 }
 if(item.kind==='pc'||item.kind==='hermes'){
 const prompt=`Sur mon PC Windows, examine ${item.title} depuis sa source officielle (${item.url||'documentation officielle'}). Vérifie sa compatibilité avec ma configuration. Ne modifie rien et n'installe rien sans me demander une confirmation explicite.`;
 state.detail=item.id;
 popup(`Préparer sur le PC : ${esc(item.title)}`,`<p>Tu peux envoyer une demande à <strong>Hermes Agent</strong> pour préparer l'installation sur Windows.</p><p>1. Copie l'instruction. 2. Ouvre Telegram. 3. Colle-la dans la discussion Hermes. 4. Confirme seulement si la procédure est sûre.</p><p class="callout">Hermes n'installera rien automatiquement depuis cette première version : l'installation reste soumise à ton accord.</p>`,`<button class="action-btn" data-action="copy-hermes" data-id="${esc(item.id)}">${icon('copy',15)} Copier la demande</button><button class="action-btn secondary" data-action="open-hermes">Ouvrir Hermes</button>`);return;
 }
 if(item.url)openUrl(item.url);
};
async function copyText(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);toast('Copié !');return}const node=document.createElement('textarea');node.value=s;document.body.appendChild(node);node.select();document.execCommand('copy');node.remove();toast('Copié !')}catch{toast('Impossible de copier automatiquement.')}}
const installationHelp=()=>popup('Installer Veille IA sur tes écrans',`<h3>📱 Sur ton iPhone</h3><ol class="plain-list"><li>Ouvre <strong>l’adresse HTTPS publiée</strong> de Veille IA dans Safari.</li><li>Touche <strong>Partager</strong>.</li><li>Choisis <strong>Sur l’écran d’accueil</strong>, puis Ajouter.</li></ol><h3>🖥 Sur Windows</h3><ol class="plain-list"><li>Ouvre la même adresse dans Edge ou Chrome.</li><li>Choisis <strong>Installer cette application</strong> depuis la barre d'adresse / menu.</li><li>Tu peux ensuite créer son raccourci sur le bureau.</li></ol><p class="callout">Pour l’instant, la version est fournie en fichiers. <strong>Elle doit encore être publiée en HTTPS</strong> pour s’installer comme une application sur les deux appareils.</p>`);
function updateStatus(msg){const el=document.querySelector('.refresh-status');if(el)el.textContent=msg;}
async function refreshLive(force=false){
 if(!force){try{const resp=await fetch(PUSH_URL+'/news',{cache:'no-store',signal:AbortSignal.timeout(14000)});if(resp.ok){const daily=await resp.json();if(Array.isArray(daily.entries)&&daily.entries.length){const fresh=daily.entries.filter(x=>x&&x.isLive&&x.id&&x.category&&x.title&&/^https:\/\//.test(x.url));const merged=new Map([...state.live,...fresh].map(x=>[x.id,x]));state.live=[...merged.values()].sort((a,b)=>Date.parse(b.date)-Date.parse(a.date)).slice(0,50);state.lastFetch=Date.now();state.feedError=false;state.firstFetch=false;persist();render();return}}}catch(e){console.debug('Flux quotidien indisponible',e)}}

 if(state.fetching)return;
 if(!force&&Date.now()-state.lastFetch<24*60*60*1000&&state.live.length){return}
 if(!navigator.onLine){state.feedError=true;toast('Hors connexion : affichage des données disponibles.');return}
 state.fetching=true;toast('Vérification des sorties publiques…');
 const fetched=[];let failures=0;
 await Promise.all(feeds.map(async f=>{
   const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),9500);
   try{const resp=await fetch(`https://api.github.com/repos/${f.repo}/releases?per_page=3`,{signal:ctrl.signal,headers:{Accept:'application/vnd.github+json'}});
     if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
     const releases=await resp.json();
     releases.filter(x=>!x.draft&&!x.prerelease&&x.published_at).slice(0,2).forEach(x=>{
       if(!/^https:\/\/github\.com\//i.test(x.html_url||''))return;
       const version=(x.name||x.tag_name||'Nouvelle version').replace(/<[^>]+>/g,'').slice(0,75);
       fetched.push({id:`gh:${f.repo}:${x.tag_name||x.id}`,category:f.category,title:`${f.label} · ${version}`,description:`Version publiée par ${f.label} sur GitHub. Consulte les notes officielles pour connaître les changements avant de mettre à jour.`,short:'Une version officielle est disponible.',date:x.published_at,source:`GitHub · ${f.repo}`,url:x.html_url,badge:'Nouveau',importance:f.importance,platform:['windows','iphone'],free:true,noApi:true,kind:f.kind,icon:f.icon,isLive:true});
     });
   }catch(e){failures++}finally{clearTimeout(to)}
 }));
 if(fetched.length){
   const oldIds=new Set(state.live.map(x=>x.id)); const newItems=fetched.filter(x=>!oldIds.has(x.id));
   state.live=fetched.sort((a,b)=>new Date(b.date)-new Date(a.date));state.lastFetch=Date.now();state.feedError=failures>0;
   if(state.firstFetch){state.firstFetch=false;toast(`${fetched.length} versions consultées sur GitHub`)}
   else {toast(newItems.length?`${newItems.length} nouvelle(s) version(s) détectée(s)`:'Aucune nouvelle version depuis la dernière vérification');
    if(newItems.length && 'Notification' in window &&Notification.permission==='granted' && document.visibilityState==='visible'){
       try{new Notification('Veille IA',{body:`${newItems.length} nouvelle(s) version(s) disponible(s).`,icon:'assets/icon-192.png'})}catch{}
    }
   }
 } else {state.feedError=true;toast('Sources non accessibles pour le moment. Réessaie plus tard.');}
 state.fetching=false;persist();render();
}
function exportSettings(){const data={exportedAt:new Date().toISOString(),version:1,read:state.read,favorites:state.favorites,installed:state.installed,prefs:state.prefs,notify:state.notify,telegram:state.telegram};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='veille-ia-reglages.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Réglages exportés')}
async function importSettings(file){if(!file)return;try{if(file.size>100000)throw new Error('Fichier trop volumineux');const obj=JSON.parse(await file.text());if(obj.version!==1)throw new Error('Format incorrect');for(const key of ['read','favorites','installed','prefs','notify'])if(obj[key]&&typeof obj[key]==='object'&&!Array.isArray(obj[key]))state[key]={...state[key],...obj[key]};if(typeof obj.telegram==='string')state.telegram=obj.telegram.slice(0,80);persist();render();toast('Réglages importés')}catch(e){toast('Impossible d’importer : '+e.message)}}
function bind(){
 document.addEventListener('click',async e=>{
   if(e.target.id==='modal'){closeModal();return}
   const el=e.target.closest('[data-action],[data-page],[data-filter],[data-pref],[data-open-category],[data-open-item]');if(!el)return;
   const {action,page,filter,pref,openCategory,openItem,id}=el.dataset;
   if(page){closeModal();setPage(page);return}
   if(openCategory){setPage('category',openCategory);return}
   if(openItem){modalItem(openItem);return}
   if(filter){state.filter=filter;render();return}
   if(pref){state.prefs[pref]=!state.prefs[pref];persist();render();return}
   if(!action)return;
   switch(action){
     case 'search':state.searchOpen=!state.searchOpen;renderHeader();document.getElementById('search')?.focus();break;
     case 'clear-search':state.query='';renderHeader();render();document.getElementById('search')?.focus();break;
     case 'refresh':await refreshLive(true);break;
     case 'reset-filter':state.filter='Tout';state.prefs={free:false,iphone:false,windows:false,noApi:false};persist();render();break;
     case 'installation-help':installationHelp();break;
     case 'close-modal':closeModal();break;
     case 'favorite':state.favorites[id]=!state.favorites[id];persist();render();if(document.getElementById('modal').classList.contains('open')){const item=itemById(id);if(item)modalItem(id)}break;
     case 'source':{const it=itemById(id);if(it)openUrl(it.url);break}
     case 'open-chatgpt':openUrl('https://chatgpt.com/');break;
     case 'install':{const it=itemById(id);if(it)platformInstall(it);break}
     case 'toggle-installed':{const it=itemById(id);if(it){state.installed[id]=!installed(it);persist();closeModal();render();toast(`Statut mis à jour : ${it.title}`)}break}
     case 'enable-browser-alerts':{try{await enablePush();toast('Notifications activées sur cet appareil')}catch(e){toast(e.message||'Notifications indisponibles')}break}
     case 'mark-all-read':state.live.forEach(x=>state.read[x.id]=true);persist();render();syncPush();toast('Alertes marquées comme lues');break;
     case 'copy-hermes':{const it=itemById(id);if(!it)break;const t=`Sur mon PC Windows, examine ${it.title} depuis sa source officielle (${it.url||'documentation officielle'}). Vérifie la compatibilité avec ma configuration. Ne modifie rien et n'installe rien sans demander ma confirmation explicite.`;await copyText(t);break}
     case 'open-hermes':case 'test-hermes':{if(!state.telegram){closeModal();setPage('profile');toast('Renseigne d’abord le nom de ton bot Telegram.')}else openUrl(`https://t.me/${encodeURIComponent(state.telegram.replace(/^@/,''))}`);break}
     case 'save-telegram':{const input=document.getElementById('botname');const v=(input?.value??'').replace(/^@/,'').trim();if(v&&!/^[A-Za-z0-9_]{5,80}$/.test(v)){toast('Nom de bot invalide');break}state.telegram=v;persist();toast('Bot enregistré sur cet appareil');break}
     case 'export':exportSettings();break;
     case 'import':document.getElementById('importfile')?.click();break;
   }
 });
 document.addEventListener('input',e=>{
   if(e.target.id==='search'){state.query=e.target.value;const scrollY=window.scrollY;document.getElementById('main').innerHTML=({home:renderHome,categories:renderCategories,category:renderCategory,alerts:renderAlerts,personal:renderPersonal,installs:renderInstalls,profile:renderProfile}[state.page]||renderHome)();window.scrollTo(0,scrollY)}
 });
 document.addEventListener('change',e=>{
   if(e.target.dataset.notify){state.notify[e.target.dataset.notify]=Boolean(e.target.checked);persist();render();syncPush();toast('Préférence enregistrée')}
   if(e.target.id==='importfile')importSettings(e.target.files?.[0]);
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-category]')){e.preventDefault();setPage('category',e.target.dataset.openCategory)}});
}
render();bind();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(Date.now()-state.lastFetch>24*60*60*1000){setTimeout(()=>refreshLive(false),1800)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncBadge();syncPush();if(Date.now()-state.lastFetch>24*60*60*1000)refreshLive(false)}});
})();

</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
